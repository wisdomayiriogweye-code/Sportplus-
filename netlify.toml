[build]
  publish = "."

[functions]
  directory = "netlify/functions"
export default async () => {
  const token = process.env.SPORTMONKS_TOKEN;

  if (!token) {
    return new Response(
      JSON.stringify({ error: "API token missing" }),
      { status: 500 }
    );
  }

  try {
    const response = await fetch(
      "https://api.sportmonks.com/v3/football/livescores/inplay?include=participants;scores;state;league",
      {
        headers: { Authorization: token }
      }
    );

    const data = await response.json();

    return new Response(JSON.stringify(data), {
      status: response.status,
      headers: { "Content-Type": "application/json" }
    });

  } catch {
    return new Response(
      JSON.stringify({ error: "Connection failed" }),
      { status: 500 }
    );
  }
};

export const config = {
  path: "/.netlify/functions/livescores"
};
